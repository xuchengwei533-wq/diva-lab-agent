      function createStreamingBotMessage() {
        const div = document.createElement("div");
        div.className = "message message-bot";
        div.textContent = "";
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
      }

      function extractSseEvents(buffer) {
        const events = [];
        let idx;
        while ((idx = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);

          const lines = rawEvent.split("\n");
          for (const line of lines) {
            if (line.startsWith("data:")) {
              const dataStr = line.slice(5).trim();
              if (dataStr) events.push(dataStr);
            }
          }
        }
        return { events, rest: buffer };
      }

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        addMessage(message, "user");
        messageInput.value = "";
        chatHistory.push({ role: "user", content: withScoreRule(message) });

        const botDiv = createStreamingBotMessage();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 120000);

        // 新一轮：清空 TTS 缓冲
        ttsTextBuf = "";
        ttsLastError = "";
        ttsRestFallback = false;
        ttsWsReceivedAudio = false;
        clearTtsAudioQueue();
        if (ttsEnabled) {
          startTtsPreludeOnce();
        }

        // 启用 TTS 时保持长连接，避免每轮握手
        if (ttsEnabled && !isTtsTotalMode()) {
          startTtsFlushTimer();
          connectTts().catch((e) => {
            ttsRestFallback = true;
            ttsLastError = toUserFriendlyTtsError(
              e?.message || "语音播报服务暂时不可用",
            );
          });
        }

        try {
          const resp = await fetch(`${CHAT_API_URL}/api/chat/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "qwen-plus", messages: chatHistory }),
            signal: controller.signal,
          });

          if (!resp.ok || !resp.body) {
            const errText = await resp.text().catch(() => "");
            botDiv.textContent = `请求失败：HTTP ${resp.status}\n${errText}`;
            return;
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder("utf-8");

          let buffer = "";
          let fullText = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const { events, rest } = extractSseEvents(buffer);
            buffer = rest;

            for (const dataStr of events) {
              let obj = null;
              try {
                obj = JSON.parse(dataStr);
              } catch (_) {}
              if (!obj) continue;

              if (obj.type === "delta" && obj.delta) {
                fullText += obj.delta;
                botDiv.textContent = fullText;
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // TTS：边出字边喂
                if (ttsEnabled && !isTtsTotalMode()) ttsFeedDelta(obj.delta);
              } else if (obj.type === "error") {
                botDiv.textContent = `模型调用错误：${obj.error}`;
              }
            }
          }

          if (fullText.trim()) {
            chatHistory.push({ role: "assistant", content: fullText });
          } else {
            const fallback =
              "我这次没有生成出有效回复。你可以换一种说法再问一次。";
            botDiv.textContent = fallback;
            chatHistory.push({ role: "assistant", content: fallback });
            fullText = fallback;
          }

          // 收尾：把尾巴 flush + commit
          if (ttsEnabled) {
            if (isTtsTotalMode()) {
              try {
                if (fullText.trim()) {
                  await speakTextViaTotal(fullText);
                }
              } catch (ttsErr) {
                console.error("[TTS-total] speak failed", ttsErr);
                console.warn("[TTS-total] fallback to legacy REST playback", ttsErr);
                try {
                  await speakTextViaRest(fullText);
                } catch (restErr) {
                  const detail = reportTtsIssue(
                    restErr?.message || String(restErr),
                  );
                  ttsLastError = detail;
                }
              }
            } else {
              ttsFlushFinal();
              if (
                (ttsRestFallback ||
                  !ttsSocket ||
                  ttsSocket.readyState !== WebSocket.OPEN) &&
                !ttsWsReceivedAudio &&
                fullText.trim()
              ) {
                try {
                  await speakTextViaRest(fullText);
                } catch (ttsErr) {
                  const detail = reportTtsIssue(
                    ttsErr?.message || String(ttsErr),
                  );
                  ttsLastError = detail;
                }
              }
            }
          }
        } catch (e) {
          botDiv.textContent =
            e.name === "AbortError"
              ? "请求超时：后端在 120 秒内未完成响应。"
              : "请求异常：" + e.message;
        } finally {
          clearTimeout(timeoutId);
          controller.abort();
        }
      }

      async function sendAudioForScoring(
        audioData,
        voiceType,
        audioFormat = "wav",
      ) {
        const response = await fetch(`${API_BASE}/api/audio/score`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio_data: audioData,
            voice_type: voiceType,
            audio_format: audioFormat,
          }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || "音频评分失败");
        }

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || "音频评分失败");
        }

        const scoringResult = {
          overall: result.overall,
          scores: result.scores,
        };

        return scoringResult;
      }

              let obj = null;
              try {
                obj = JSON.parse(dataStr);
              } catch (_) {}
              if (!obj) continue;

              if (obj.type === "delta" && obj.delta) {
                fullText += obj.delta;
                suggestionBotDiv.textContent = fullText;
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else if (obj.type === "error") {
                suggestionBotDiv.textContent = `生成建议错误：${obj.error}`;
              }
            }
          }

          if (fullText.trim()) {
            chatHistory.push({ role: "assistant", content: fullText });
          } else {
            suggestionBotDiv.textContent = "抱歉，我这次没有生成出有效建议。";
          }
        } catch (e) {
          const lastBotMsg = chatMessages.lastElementChild;
          if (lastBotMsg?.textContent === "正在根据评分生成建议...") {
            lastBotMsg.textContent =
              e.name === "AbortError"
                ? "生成建议超时，请稍后重试。"
                : "生成建议失败：" + e.message;
          }
        } finally {
          clearTimeout(timeoutId);
          controller.abort();
        }
      }

      function drawScoreChart(result, chartBarsId = "chartBars") {
        const chartBars = document.getElementById(chartBarsId);
        if (!chartBars) return;

        const scores = result.scores || [];
        if (scores.length === 0) {
          chartBars.innerHTML = '<p style="color:#999;">暂无评分数据</p>';
          return;
        }

        chartBars.innerHTML = "";
        scores.forEach((item) => {
          const barHeight = (item.score / 5) * 160;
          const displayName = TECH_NAME_MAP[item.technique] || item.technique;
          const barItem = document.createElement("div");
          barItem.className = "chart-bar-item";
          barItem.innerHTML = `
          <span class="chart-bar-value">${item.score}</span>
          <div class="chart-bar" style="height:${barHeight}px;"></div>
          <span class="chart-bar-label" title="${displayName}">${displayName}</span>
        `;
          chartBars.appendChild(barItem);
        });
      }

      function showError(message, resultsId = "scoringResults") {
        const resultsDiv = document.getElementById(resultsId);
        if (!resultsDiv) return;
        resultsDiv.innerHTML = `<div class="error"><p>${message}</p></div>`;
        resultsDiv.style.display = "block";
      }

      async function preflightMediaPermissions() {
        if (!navigator.permissions?.query) return;
        try {
          await navigator.permissions.query({ name: "microphone" });
        } catch (_) {}
        try {
          await navigator.permissions.query({ name: "camera" });
        } catch (_) {}
      }

      // =========================
      // 初始化
      // =========================
      window.addEventListener("load", () => {
        (async () => {
          await preflightMediaPermissions();
        })();
        voiceButton.addEventListener("click", toggleRecording);

        ttsToggleBtn.addEventListener("click", async () => {
          ttsEnabled = !ttsEnabled;

          if (ttsEnabled) {
            ttsToggleBtn.textContent = "🔊";
            if (!isTtsTotalMode()) {
              try {
                await connectTts();
                startTtsFlushTimer();
              } catch (e) {
                console.error(e);
              }
            }
          } else {
            ttsToggleBtn.textContent = "🔇";
            closeTts();
          }
        });

        window.addEventListener("beforeunload", () => {
          try {
            closeTts();
          } catch (_) {}
        });
      });

      document.addEventListener("DOMContentLoaded", () => {
        const audioFileElement = document.getElementById("audioFile");
        if (audioFileElement) {
          audioFileElement.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
              const label = document.querySelector(".file-label");
              if (label) label.textContent = `📁 ${file.name}`;
            }
          });
        }

        const audioScoringModal = document.getElementById("audioScoringModal");
        if (audioScoringModal) {
          audioScoringModal.addEventListener("click", (e) => {
            if (e.target === audioScoringModal) closeAudioScoringModal();
          });
        }

        const scoreVoiceModal = document.getElementById("scoreVoiceModal");
        if (scoreVoiceModal) {
          scoreVoiceModal.addEventListener("click", (e) => {
            if (e.target === scoreVoiceModal) closeScoreVoiceModal();
          });
        }
      });
    </script>
  </body>
</html>
