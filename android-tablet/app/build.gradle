plugins {
    id "com.android.application"
}

android {
    namespace "com.maozhishi.tablet"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.maozhishi.tablet"
        minSdk 21
        targetSdk 35
        versionCode 15
        versionName "0.15.0-lan-vad-wake"
        buildConfigField "String", "DEFAULT_PAGE_URL", "\"http://192.168.5.204:8000/tablet_legacy.html?singleOrigin=1&publicMode=1&voiceMode=1&apkVersion=15\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

