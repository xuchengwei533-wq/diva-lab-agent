plugins {
    id "com.android.application"
}

android {
    namespace "com.maozhishi.tablet"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.maozhishi.tablet"
        minSdk 21
        targetSdk 35
        versionCode 19
        versionName "0.19.0-xiaosita222-wake"
        buildConfigField "String", "DEFAULT_PAGE_URL", "\"https://test.diva-ai.cn/xiaosita222/?singleOrigin=1&publicMode=1&voiceMode=1&apkWake=1&wakePhrase=%E4%BD%A0%E5%A5%BD&apkVersion=19\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

