plugins {
    id "com.android.application"
}

android {
    namespace "com.maozhishi.tablet"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.maozhishi.tablet"
        minSdk 21
        targetSdk 35
        versionCode 9
        versionName "0.9.0-tunnel-refresh"
        buildConfigField "String", "DEFAULT_PAGE_URL", "\"https://reporters-dealtime-defence-advised.trycloudflare.com/tablet_legacy.html?singleOrigin=1&legacy=1&lite=1&renderMode=gif&disableFace=1\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

