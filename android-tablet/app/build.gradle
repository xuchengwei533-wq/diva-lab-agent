plugins {
    id "com.android.application"
}

android {
    namespace "com.maozhishi.tablet"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.maozhishi.tablet"
        minSdk 21
        targetSdk 35
        versionCode 20
        versionName "0.20.0-sleep-interrupt"
        buildConfigField "String", "DEFAULT_PAGE_URL", "\"https://test.diva-ai.cn/xiaosita222/?singleOrigin=1&publicMode=1&voiceMode=1&apkWake=1&wakePhrase=%E4%BD%A0%E5%A5%BD%E8%80%81%E8%82%96&interruptPhrase=%E4%BD%A0%E5%A5%BD%E8%80%81%E6%B6%88&apkVersion=20\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

